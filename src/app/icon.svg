<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background - full square, no rounded corners -->
  <rect width="32" height="32" fill="#1B2B4B"/>
  <!-- Gold scale of justice -->
  <!-- Center post -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="#B08D57" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="12" y1="26" x2="20" y2="26" stroke="#B08D57" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top balance bar -->
  <line x1="7" y1="10" x2="25" y2="10" stroke="#B08D57" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top pin -->
  <circle cx="16" cy="7" r="1" fill="#B08D57"/>
  <!-- Left chain -->
  <line x1="7" y1="10" x2="7" y2="19" stroke="#B08D57" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right chain -->
  <line x1="25" y1="10" x2="25" y2="19" stroke="#B08D57" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M4 19 Q7 21 10 19" stroke="#B08D57" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M22 19 Q25 21 28 19" stroke="#B08D57" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
