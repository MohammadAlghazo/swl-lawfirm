<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; color: white; font-family: sans-serif; }
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 50px;
    }
    
    .test-box {
      border: 1px solid red;
    }

    /* Option 1: Scale */
    .crop-1 {
      width: 250px;
      height: 70px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justifyContent: center;
      background: white; /* just in case */
      border-radius: 4px;
    }
    .crop-1 img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(2.2);
    }

    /* Option 2: absolute position */
    .crop-2 {
      width: 260px;
      height: 70px;
      overflow: hidden;
      position: relative;
      background: white;
      border-radius: 4px;
    }
    .crop-2 img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      width: 260px;
      height: auto;
    }
    
    /* Option 3: Object Fit Cover */
    .crop-3 {
      width: 260px;
      height: 70px;
      overflow: hidden;
      border-radius: 4px;
      background: white;
    }
    .crop-3 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
  </style>
</head>
<body>
  <h2>Original Image</h2>
  <img src="/images/logo.png" width="300" style="border:1px solid yellow" />
  
  <div class="container">
    <div>
      <h3>Option 1: Scale</h3>
      <div class="test-box crop-1"><img src="/images/logo.png" /></div>
    </div>
    <div>
      <h3>Option 2: Absolute + Scale</h3>
      <div class="test-box crop-2"><img src="/images/logo.png" /></div>
    </div>
    <div>
      <h3>Option 3: Object Fit Cover</h3>
      <div class="test-box crop-3"><img src="/images/logo.png" /></div>
    </div>
  </div>
</body>
</html>
